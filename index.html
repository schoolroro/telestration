<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>통합사회 텔레스트레이션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0f5f8f;--navy2:#1a86c4;--gold:#16b3c4;--gold-deep:#0d7f8e;
    --ink:#232c3a;--sub:#6b7686;--line:#dfeaf1;--bg:#f2f9fb;--card:#fff;--ok:#2f9e6b;--warn:#c8503f;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%}
  body{margin:0;color:var(--ink);font-family:"Gothic A1","Noto Sans KR",system-ui,sans-serif;
    background:
      radial-gradient(130% 55% at 50% 0%, #cfeafa 0%, rgba(207,234,250,0) 60%),
      linear-gradient(180deg,#e2f2fa 0,#ecf7fb 360px,#f2f9fb 100%) no-repeat var(--bg);
    -webkit-font-smoothing:antialiased;line-height:1.6;-webkit-tap-highlight-color:transparent;}
  .wrap{max-width:720px;margin:0 auto;padding:0 16px 30px;min-height:100%;display:flex;flex-direction:column;}
  .view{display:none;flex:1;flex-direction:column;} .view.on{display:flex;}
  h1,h2,h3{letter-spacing:-.01em;margin:0;font-family:"Jua",sans-serif;font-weight:400;}

  .btn{border:none;border-radius:14px;font-family:"Jua",sans-serif;font-weight:400;cursor:pointer;font-size:17px;
    padding:15px 22px;transition:filter .15s,opacity .15s;}
  .btn.primary{background:var(--navy);color:#fff;} .btn.gold{background:var(--gold);color:#04323a;}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .btn.block{display:block;width:100%;} .btn:active{filter:brightness(.94);} .btn:disabled{opacity:.4;}
  .input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:15px 16px;
    font-family:"Jua",sans-serif;font-size:18px;font-weight:400;color:var(--navy);text-align:center;}
  .input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(27,42,74,.12);}

  /* landing */
  #landing{justify-content:center;text-align:center;padding-top:30px;}
  #landing .badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold-deep);
    background:rgba(201,162,75,.15);border-radius:7px;padding:4px 11px;}
  #landing h1{font-size:34px;color:var(--navy);margin:16px 0 6px;}
  #landing p{color:var(--sub);font-size:14.5px;margin:0 0 26px;}
  #landing .pick{display:grid;gap:14px;max-width:420px;margin:0 auto;width:100%;}
  #landing .pick .btn{padding:22px;font-size:18px;}
  #landing .pick .sub{display:block;font-size:12.5px;font-weight:500;opacity:.8;margin-top:4px;}

  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;gap:10px;}
  .top .t{font-family:"Jua",sans-serif;font-weight:400;color:var(--navy);font-size:20px;}
  .top .rt{font-size:13px;color:var(--sub);}
  .back{background:none;border:none;color:var(--sub);font-family:inherit;font-size:13px;cursor:pointer;padding:12px 0 2px;}
  .back:hover{color:var(--navy);}

  .codebox{text-align:center;background:var(--navy);color:#fff;border-radius:18px;padding:20px;margin:6px 0 14px;}
  .codebox .lbl{font-size:12px;letter-spacing:.1em;color:#cdd7ea;font-weight:700;}
  .codebox .code{font-family:"Jua",sans-serif;font-size:46px;font-weight:400;letter-spacing:.1em;margin:4px 0;}
  .codebox .hint{font-size:12.5px;color:#aebbd4;}

  .plist{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px;}
  .ptag{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:700;color:var(--navy);}
  button.ptag.kick{font-family:inherit;cursor:pointer;transition:all .12s;}
  button.ptag.kick span{color:#b9c4d2;margin-left:2px;}
  button.ptag.kick:hover{border-color:var(--warn);color:var(--warn);}
  button.ptag.kick:hover span{color:var(--warn);}
  .muted{color:var(--sub);font-size:13.5px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0;}
  .pcell{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12.5px;}
  .pcell .nm{font-weight:700;color:var(--navy);display:flex;align-items:center;justify-content:space-between;gap:6px;}
  .pcell .st{font-size:11px;font-weight:700;}
  .pcell .st.done{color:var(--ok);} .pcell .st.wait{color:var(--warn);}
  .pcell img{width:100%;height:92px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:7px;}
  .pcell .gw{margin-top:7px;font-weight:800;color:var(--ink);font-size:14px;}

  .pips{display:flex;gap:4px;flex:1;max-width:55%;justify-content:flex-end;}
  .pip{flex:1;max-width:16px;height:5px;border-radius:3px;background:var(--line);}
  .pip.done{background:var(--gold);} .pip.now{background:var(--navy);}

  .promptcard{background:var(--navy);color:#fff;border-radius:18px;padding:22px;text-align:center;margin:6px 0 12px;}
  .promptcard .plabel{font-size:12px;letter-spacing:.1em;color:#cdd7ea;font-weight:700;}
  .promptcard .pword{font-family:"Jua",sans-serif;font-size:32px;font-weight:400;margin:8px 0 2px;}
  .promptcard.guess{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .promptcard.guess .plabel{color:var(--sub);}
  .promptcard img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#fff;}
  .taskline{font-family:"Jua",sans-serif;font-weight:400;color:var(--navy);font-size:16px;margin:2px 0 10px;text-align:center;}

  .canvaswrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;}
  canvas{display:block;width:100%;touch-action:none;background:#fff;}
  .tools{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;align-items:center;}
  .tool{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--navy);cursor:pointer;}
  .tool.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tool:disabled{opacity:.35;cursor:default;}
  .swatches{display:flex;gap:6px;margin-left:auto;}
  .sw{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);}
  .sw.on{box-shadow:0 0 0 2px var(--navy);}

  .waitbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:30px;}
  .waitbox .big{font-size:40px;} .waitbox h2{color:var(--navy);font-size:22px;} .waitbox p{color:var(--sub);margin:0;}

  .spacer{flex:1;}
  .notice{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--sub);margin:8px 0;}
  .err{color:var(--warn);font-size:13.5px;margin:8px 0;text-align:center;}

  /* reveal */
  .revealbar{display:flex;gap:8px;align-items:center;margin:10px 0;}
  .revealbar select{flex:1;font-family:inherit;font-size:15px;font-weight:700;color:var(--navy);padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;}
  .chain{display:flex;flex-direction:column;gap:12px;margin-top:8px;}
  .step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;}
  .step .slabel{font-size:11.5px;font-weight:800;letter-spacing:.04em;color:var(--gold-deep);background:rgba(201,162,75,.15);border-radius:6px;padding:3px 9px;display:inline-block;}
  .step .sword{font-family:"Jua",sans-serif;font-size:26px;font-weight:400;color:var(--navy);margin-top:9px;}
  .step.origin{background:var(--navy);border-color:var(--navy);} .step.origin .slabel{color:#201a0a;background:var(--gold);} .step.origin .sword{color:#fff;}
  .step img{width:100%;max-height:360px;object-fit:contain;border-radius:10px;margin-top:9px;background:#fff;}
  .step .by{font-size:11.5px;color:var(--sub);margin-top:6px;}
  .step .who{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:14.5px;font-family:"Jua",sans-serif;font-weight:400;color:var(--navy);background:#f1f4fa;border:1px solid var(--line);border-radius:999px;padding:5px 12px;}
  .step .who.miss{color:var(--sub);background:#faf6f2;}
  .connector{text-align:center;color:#c2cad8;font-size:18px;margin:-4px 0;}
</style>
</head>
<body>
<div class="wrap">

  <!-- LANDING -->
  <section id="landing" class="view on">
    <div><span class="badge">통합사회 · 협동 게임</span></div>
    <h1>텔레스트레이션</h1>
    <p>그림 전화 게임 — 그리기와 맞히기를 번갈아 이어가요.</p>
    <div class="pick">
      <button class="btn primary" id="toHost">교사용 · 방 만들기<span class="sub">큰 화면(노트북·TV)에서 여세요</span></button>
      <button class="btn gold" id="toJoin">학생용 · 입장하기<span class="sub">각자 폰·패드에서 방 코드로 입장</span></button>
    </div>
    <p class="muted" id="landFoot" style="text-align:center;margin-top:24px"></p>
  </section>

  <!-- JOIN (student) -->
  <section id="join" class="view">
    <button class="back" data-home>← 처음으로</button>
    <div class="spacer"></div>
    <h2 style="color:var(--navy);text-align:center;margin-bottom:16px">방에 입장</h2>
    <input class="input" id="joinCode" inputmode="numeric" maxlength="4" placeholder="방 코드 (숫자 4자리)" style="margin-bottom:12px;letter-spacing:.2em">
    <input class="input" id="joinName" maxlength="12" placeholder="이름" style="margin-bottom:14px">
    <div class="err" id="joinErr"></div>
    <button class="btn gold block" id="joinBtn">입장하기</button>
    <div class="spacer"></div>
  </section>

  <!-- HOST -->
  <section id="host" class="view">
    <div class="top"><span class="t">교사용 진행</span><span class="rt" id="hostRt"></span></div>
    <div id="hostMain"></div>
  </section>

  <!-- PLAYER -->
  <section id="player" class="view">
    <div id="playerMain"></div>
  </section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, push, remove }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ===== 선생님의 Firebase 설정값 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAoh5P7dwSRevDm64n_IMOM3QKRkT-jWkg",
  authDomain: "telestration-92f36.firebaseapp.com",
  databaseURL: "https://telestration-92f36-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "telestration-92f36",
  storageBucket: "telestration-92f36.firebasestorage.app",
  messagingSenderId: "783154907219",
  appId: "1:783154907219:web:3dceeaf8cd0aa7cbfcdea6"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== 게임 설정 ===== */
const WORDS = [
  // --- 통합사회1 ---
  "행복","정주 환경","기후","지형","열대 우림","사막화",
  "지구 온난화","자연재해","생태중심주의","인간중심주의","산업화","도시화",
  "정보화","정보 격차","공정 여행","계절풍","고산 지대","점이 지대",
  "플랜테이션 농업","탄소 중립","디지털 탄소 발자국",
  // --- 통합사회2 ---
  "인권","인간 존엄성","천부 인권","시민 혁명","참정권","사회권",
  "헌법","기본권","사회적 소수자","청소년 노동권","자본주의","시장 경제",
  "수요와 공급","경쟁","국제 분업","무역","자산 관리","금융",
  "저축","신용","사회 정의","분배 정의","공정 무역","빈부 격차",
  "공간 불평등","사회 복지","복지 국가","문화","문화권","문화 상대주의",
  "문화 변동","다문화 사회","세계화","지구촌","세계시민","국제기구",
  "국제 협력","국제 갈등","평화","남북 분단","통일","난민",
  "인구 고령화","저출산","지속가능한 발전","기후 변화","생태계","미세먼지",
  "디지털 격차","크리스트교","간접 전파","공자","국내 총생산(GDP)","문화 융합",
  "자극 전파","자문화 중심주의","다국적 기업","롤스","신자유주의","애덤 스미스",
  "이산가족","인플레이션","차티스트 운동","합계 출산율",
  // --- 공통 시민성 ---
  "민주주의","공동체","자원봉사","양성 평등","시민 참여","공공의 이익"
];
const MAX_TURNS = 10;                 // 그림 5번(= 10라운드)이 목표
const COLORS = ["#1b2432","#1f7fd0","#d04a3c","#2f9e6b","#e3a32a","#7a53c0"]; // 검정·파랑·빨강·초록·노랑·보라
const isDraw = r => r%2===0;          // 짝수 라운드=그리기, 홀수=맞히기

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function view(id){document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ===== 라우팅 ===== */
$("toHost").onclick=hostCreate;
$("toJoin").onclick=()=>{ view("join"); };
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>location.reload());

// URL ?room=코드 로 학생 입장 편의
const urlRoom=new URLSearchParams(location.search).get("room");
if(urlRoom){ $("joinCode").value=urlRoom.replace(/\D/g,"").slice(0,4); view("join"); }
try{ const last=JSON.parse(localStorage.getItem("tele_last")||"null");
  if(last){ if(!$("joinCode").value) $("joinCode").value=last.code||""; $("joinName").value=last.name||""; }
}catch(e){}

/* ================= 교사(호스트) ================= */
let hostCode=null, hostUnsub=null;
async function hostCreate(){
  // 4자리 코드 생성(중복 회피 간단 체크)
  let code;
  for(let t=0;t<6;t++){ code=String(Math.floor(1000+Math.random()*9000));
    const snap=await get(ref(db,"rooms/"+code+"/meta")); if(!snap.exists()) break; }
  hostCode=code;
  await set(ref(db,"rooms/"+code),{meta:{status:"lobby",createdAt:Date.now()}});
  view("host");
  if(hostUnsub) hostUnsub();
  hostUnsub=onValue(ref(db,"rooms/"+code),snap=>renderHost(snap.val()||{}));
}
function renderHost(room){
  const meta=room.meta||{}; const st=meta.status;
  $("hostRt").textContent="방 코드 "+hostCode;
  if(st==="lobby") renderHostLobby(room);
  else if(st==="playing") renderHostPlaying(room);
  else if(st==="reveal") renderHostReveal(room);
}
function playerArr(room){
  const ps=room.players||{};
  return Object.keys(ps).map(uid=>({uid,...ps[uid]}));
}
function renderHostLobby(room){
  const list=playerArr(room);
  const joinUrl=location.origin+location.pathname+"?room="+hostCode;
  $("hostMain").innerHTML=
    `<div class="codebox"><div class="lbl">학생 입장 코드</div><div class="code">${hostCode}</div>`+
    `<div class="hint">학생들은 이 사이트에서 ‘학생용 · 입장하기’ → 코드 입력</div></div>`+
    `<div class="muted" style="margin-bottom:6px">입장한 학생 <b>${list.length}</b>명</div>`+
    `<div class="plist">${list.map(p=>`<button class="ptag kick" data-uid="${p.uid}" title="퇴장시키기">${esc(p.name)} <span>✕</span></button>`).join("")||'<span class="muted">아직 없음…</span>'}</div>`+
    `<div class="notice">이름을 누르면 그 학생을 <b>퇴장</b>시킬 수 있어요(중복·오타 정리용).<br>
      다 들어오면 시작하세요. 시작 뒤에는 새로 참여할 수 없지만, <b>접속이 끊긴 학생은 같은 이름으로 다시 들어오면</b> 이어서 할 수 있어요. (권장 4명 이상)</div>`+
    `<button class="btn primary block" id="startBtn" ${list.length<2?"disabled":""}>게임 시작 (${list.length}명)</button>`;
  document.querySelectorAll(".ptag.kick").forEach(b=>{
    b.onclick=async()=>{
      const nm=b.textContent.replace("✕","").trim();
      if(confirm(nm+" 학생을 퇴장시킬까요?")) await remove(ref(db,"rooms/"+hostCode+"/players/"+b.dataset.uid));
    };
  });
  $("startBtn") && ($("startBtn").onclick=()=>hostStart(room));
}
async function hostStart(room){
  const list=shuffle(playerArr(room));
  const n=list.length;
  const T=Math.min(MAX_TURNS,n);          // 인원이 적으면 그만큼 짧게
  const deck=shuffle(WORDS.slice());
  const updates={};
  const words={};
  list.forEach((p,seat)=>{
    updates["rooms/"+hostCode+"/players/"+p.uid+"/seat"]=seat;
    words[seat]=deck[seat%deck.length];
  });
  // 라운드별 이동량(offset). 0라운드는 자기 제시어, 이후는 서로 다른 값으로 랜덤 배치
  // → 매 라운드 '앞 사람'이 달라지고, 같은 책을 두 번 받지 않는다.
  // 후보를 여러 번 뽑아, '받는 상대'가 가장 적게 겹치는 배치를 고른다
  let offsets=null, best=-1;
  for(let t=0;t<60;t++){
    const cand=[0].concat(shuffle(Array.from({length:n-1},(_,i)=>i+1)).slice(0,T-1));
    const deltas=new Set();
    for(let r=1;r<cand.length;r++) deltas.add(((cand[r]-cand[r-1])%n+n)%n);
    if(deltas.size>best){ best=deltas.size; offsets=cand; if(best===T-1) break; }
  }
  updates["rooms/"+hostCode+"/meta/offsets"]=offsets;
  updates["rooms/"+hostCode+"/words"]=words;
  updates["rooms/"+hostCode+"/meta/status"]="playing";
  updates["rooms/"+hostCode+"/meta/round"]=0;
  updates["rooms/"+hostCode+"/meta/n"]=n;
  updates["rooms/"+hostCode+"/meta/T"]=T;
  await update(ref(db),updates);
}
function renderHostPlaying(room){
  const meta=room.meta, r=meta.round, n=meta.n, T=meta.T;
  const list=playerArr(room).sort((a,b)=>a.seat-b.seat);
  const content=room.content||{}; const live=room.live||{};
  const offs=meta.offsets||[]; const off=(offs[r]!==undefined?offs[r]:r);
  // 이번 라운드에 각 '행위자(seat p)'가 맡은 책 b=(p-off+n)%n
  let done=0; const cells=list.map(p=>{
    const b=((p.seat-off)%n+n)%n;
    const sub=(content[b]&&content[b][r])||null;
    if(sub) done++;
    let inner;
    if(sub && sub.type==="draw") inner=`<div class="st done">완료</div><img src="${sub.value}">`;
    else if(sub) inner=`<div class="st done">완료</div><div class="gw">“${esc(sub.value)}”</div>`;
    else if(isDraw(r) && live[b]) inner=`<div class="st wait">그리는 중…</div><img src="${live[b]}">`;
    else inner=`<div class="st wait">${isDraw(r)?"그리는 중…":"생각 중…"}</div>`;
    return `<div class="pcell"><div class="nm">${esc(p.name)}</div>${inner}</div>`;
  }).join("");
  const kind=isDraw(r)?"그리기":"맞히기";
  const last = r>=T-1;
  $("hostMain").innerHTML=
    `<div class="top" style="padding-top:4px"><span class="t">${r+1}라운드 · ${kind}</span>`+
    `<div class="pips">${Array.from({length:T},(_,i)=>`<div class="pip ${i<r?'done':i===r?'now':''}"></div>`).join("")}</div></div>`+
    `<div class="muted" style="margin:2px 0 10px">제출 <b>${done}</b> / ${n}명 — 다 안 해도 넘길 수 있어요(빈 칸으로 처리)</div>`+
    `<button class="btn primary block" id="nextBtn">${last?"그만하고 결과 공개 →":"다음 라운드 →"}</button>`+
    `<div class="grid">${cells}</div>`;
  $("nextBtn").onclick=()=>hostNext(meta);
}
async function hostNext(meta){
  const nr=meta.round+1;
  if(nr>=meta.T){ await update(ref(db,"rooms/"+hostCode+"/meta"),{status:"reveal"}); }
  else{
    const u={};
    u["rooms/"+hostCode+"/meta/round"]=nr;
    u["rooms/"+hostCode+"/live"]=null;   // 지난 라운드 진행중 그림 미리보기 정리
    await update(ref(db),u);
  }
}
let revealSel=0;
function renderHostReveal(room){
  const meta=room.meta, n=meta.n, T=meta.T, words=room.words||{}, content=room.content||{};
  const list=playerArr(room).sort((a,b)=>a.seat-b.seat);
  const nameBySeat=s=>{const p=list.find(x=>x.seat===s);return p?p.name:("좌석"+s);};
  if(revealSel>=n) revealSel=0;
  const b=revealSel;
  // 체인 구성: 제시어 → content[b][0..T-1]
  let steps=`<div class="step origin"><span class="slabel">출발 제시어</span><div class="sword">${esc(words[b]||"?")}</div><div class="who">🏁 ${esc(nameBySeat(b))}</div></div>`;
  for(let r=0;r<T;r++){
    const offR=(meta.offsets&&meta.offsets[r]!==undefined)?meta.offsets[r]:r;
    const actorSeat=((b+offR)%n);
    const c=content[b]&&content[b][r];
    steps+=`<div class="connector">↓</div>`;
    if(!c) steps+=`<div class="step"><span class="slabel">${r+1}라운드</span><div class="who miss">✏️ ${esc(nameBySeat(actorSeat))} · 제출 안 함</div></div>`;
    else if(c.type==="draw") steps+=`<div class="step"><span class="slabel">${r+1}라운드 · 그림</span><div class="who">✏️ ${esc(nameBySeat(actorSeat))}</div><img src="${c.value}"></div>`;
    else steps+=`<div class="step"><span class="slabel">${r+1}라운드 · 추측</span><div class="who">💬 ${esc(nameBySeat(actorSeat))}</div><div class="sword">${esc(c.value)}</div></div>`;
  }
  const opts=list.map(p=>`<option value="${p.seat}" ${p.seat===revealSel?"selected":""}>${esc(p.name)} 의 그림</option>`).join("");
  $("hostMain").innerHTML=
    `<h2 style="color:var(--navy);margin:6px 0 2px">🎉 결과 공개</h2>`+
    `<div class="muted" style="margin-bottom:6px">학생 이름을 골라 그 사람의 제시어가 어떻게 변했는지 함께 보세요.</div>`+
    `<div class="revealbar"><select id="revealPick">${opts}</select>`+
    `<button class="btn ghost" id="revPrev">◀</button><button class="btn ghost" id="revNext">▶</button></div>`+
    `<div class="chain">${steps}</div>`+
    `<button class="btn ghost block" id="endBtn" style="margin-top:18px">게임 종료(방 닫기)</button>`;
  $("revealPick").onchange=e=>{revealSel=+e.target.value;renderHostReveal(room);};
  $("revPrev").onclick=()=>{revealSel=(revealSel-1+n)%n;renderHostReveal(room);};
  $("revNext").onclick=()=>{revealSel=(revealSel+1)%n;renderHostReveal(room);};
  $("endBtn").onclick=async()=>{ if(confirm("방을 닫을까요? (데이터 삭제)")){ await remove(ref(db,"rooms/"+hostCode)); location.reload(); } };
}

/* ================= 학생(플레이어) ================= */
let myCode=null,myUid=null,myName=null,mySeat=null,playerUnsub=null,lastRoundRendered=-9,submittedRound=-9;
let lastSubmit=null, keepStrokes=null, keepGuess="", keepRound=-9;  // 제출 취소 시 복원용
let liveTimer=null,liveDirty=false;
function stopLive(){ if(liveTimer){clearInterval(liveTimer);liveTimer=null;} liveDirty=false; }
$("joinBtn").onclick=joinRoom;
async function joinRoom(){
  const code=$("joinCode").value.replace(/\D/g,"").slice(0,4);
  const name=$("joinName").value.trim();
  $("joinErr").textContent="";
  if(code.length!==4){$("joinErr").textContent="방 코드 4자리를 입력하세요.";return;}
  if(!name){$("joinErr").textContent="이름을 입력하세요.";return;}
  const metaSnap=await get(ref(db,"rooms/"+code+"/meta"));
  if(!metaSnap.exists()){$("joinErr").textContent="그런 방이 없어요. 코드를 확인하세요.";return;}
  const status=metaSnap.val().status;
  // 같은 이름이 이미 있으면 그 자리로 '재진입' (튕겼다 들어온 경우)
  const psSnap=await get(ref(db,"rooms/"+code+"/players"));
  const ps=psSnap.val()||{};
  const mine=Object.keys(ps).find(k=>(ps[k].name||"").trim()===name);
  if(mine){
    myCode=code;myUid=mine;myName=ps[mine].name;
  }else{
    if(status!=="lobby"){$("joinErr").textContent="이미 시작된 방이에요. (중간 참여 불가 — 하던 학생은 쓰던 이름 그대로 입력하세요)";return;}
    const pref=push(ref(db,"rooms/"+code+"/players"));
    await set(pref,{name,joinedAt:Date.now()});
    myCode=code;myUid=pref.key;myName=name;
  }
  try{ localStorage.setItem("tele_last",JSON.stringify({code,name})); }catch(e){}
  view("player");
  if(playerUnsub) playerUnsub();
  playerUnsub=onValue(ref(db,"rooms/"+code),snap=>renderPlayer(snap.val()||{}));
}
function renderPlayer(room){
  const meta=room.meta||{}; const st=meta.status;
  const me=(room.players||{})[myUid];
  if(!me){
    stopLive();
    const closed = !meta.status;   // 방 자체가 사라졌으면 종료, 아니면 퇴장 조치
    $("playerMain").innerHTML=`<div class="waitbox"><div class="big">${closed?"🔚":"👋"}</div>`+
      `<h2>${closed?"방이 종료됐어요":"방에서 나왔어요"}</h2>`+
      `<p>${closed?"선생님이 방을 닫았습니다.":"선생님이 퇴장시켰어요. 다시 들어오려면 아래를 누르세요."}</p>`+
      `<button class="btn ghost" data-home>처음으로</button></div>`;
    $("playerMain").querySelector("[data-home]").onclick=()=>location.reload();return;
  }
  mySeat=(me.seat!==undefined)?me.seat:null;
  if(st==="lobby"){
    stopLive();
    const cnt=Object.keys(room.players||{}).length;
    $("playerMain").innerHTML=`<div class="waitbox"><div class="big">⏳</div><h2>입장 완료!</h2>`+
      `<p><b>${esc(myName)}</b> 님, 시작을 기다려 주세요.</p><p class="muted">현재 ${cnt}명 입장</p></div>`;
    lastRoundRendered=-9;submittedRound=-9;return;
  }
  if(st==="reveal"){
    stopLive();
    $("playerMain").innerHTML=`<div class="waitbox"><div class="big">🎉</div><h2>게임 끝!</h2><p>앞 화면(선생님 화면)을 함께 봐요.</p></div>`;return;
  }
  if(st==="playing"){
    const r=meta.round;
    if(r===submittedRound){ // 이미 이번 라운드 제출함 → 대기
      showWait(room); return;
    }
    if(r!==lastRoundRendered){ lastRoundRendered=r; renderTask(room); }
  }
}
function showWait(room){
  const meta=room.meta, done=countDone(room,meta.round), n=meta.n;
  $("playerMain").innerHTML=`<div class="waitbox"><div class="big">✅</div><h2>제출 완료!</h2>`+
    `<p>다른 친구들을 기다리는 중…</p><p class="muted">${done} / ${n}명 제출</p>`+
    `<button class="btn ghost" id="cancelBtn" style="margin-top:16px">✏️ 제출 취소하고 고치기</button>`+
    `<p class="muted" style="font-size:12.5px">선생님이 다음 라운드로 넘기기 전까지 고칠 수 있어요.</p></div>`;
  const cb=$("cancelBtn"); if(cb) cb.onclick=cancelSubmit;
}
async function cancelSubmit(){
  if(!lastSubmit) return;
  const {b,r}=lastSubmit;
  const snap=await get(ref(db,"rooms/"+myCode));
  const room=snap.val()||{};
  if(!room.meta || room.meta.round!==r){   // 이미 다음 라운드로 넘어갔으면 취소 불가
    alert("이미 다음 라운드로 넘어가서 고칠 수 없어요.");
    renderPlayer(room); return;
  }
  await remove(ref(db,"rooms/"+myCode+"/content/"+b+"/"+r));
  submittedRound=-9; lastRoundRendered=-9; lastSubmit=null;
  const snap2=await get(ref(db,"rooms/"+myCode));
  renderPlayer(snap2.val()||{});
}
function countDone(room,r){const c=room.content||{};let d=0;Object.keys(c).forEach(b=>{if(c[b]&&c[b][r])d++;});return d;}

function renderTask(room){
  const meta=room.meta, r=meta.round, n=meta.n, T=meta.T;
  const offs=meta.offsets||[]; const off=(offs[r]!==undefined?offs[r]:r);
  const b=((mySeat-off)%n+n)%n;                    // 내가 이번에 맡은 '책'
  stopLive();
  if(keepRound!==r){ keepStrokes=null; keepGuess=""; }   // 라운드가 바뀌면 보관분 폐기
  const prev = r===0 ? {type:"word",value:(room.words||{})[b]}
                     : ((room.content||{})[b]||{})[r-1];
  const header=`<div class="top"><span class="t">${r+1}라운드 · ${isDraw(r)?"그리기":"맞히기"}</span>`+
    `<div class="pips">${Array.from({length:T},(_,i)=>`<div class="pip ${i<r?'done':i===r?'now':''}"></div>`).join("")}</div></div>`;
  if(isDraw(r)){
    const word = prev ? prev.value : "?";
    $("playerMain").innerHTML=header+
      `<div class="promptcard"><div class="plabel">${r===0?"제시어":"앞 사람이 적은 단어"}</div><div class="pword">${esc(word)}</div></div>`+
      `<div class="taskline">✏️ 이 단어를 그림으로 그려주세요</div>`+
      `<div class="canvaswrap"><canvas id="pad"></canvas></div>`+
      `<div class="tools"><button class="tool on" id="penBtn">✏️ 펜</button><button class="tool" id="eraBtn">🩹 지우개</button>`+
      `<button class="tool" id="undoBtn" disabled>↩️ 되돌리기</button><button class="tool" id="clrBtn">🗑️ 전체</button>`+
      `<div class="swatches" id="swatches"></div></div>`+
      `<button class="btn primary block" id="submitDraw">완성 · 제출</button>`;
    setupCanvas();
    if(keepRound===r && keepStrokes){ strokes=keepStrokes.slice(); redraw(); updateUndo(); }  // 취소 후 복원
    // 그리는 중 실시간 미리보기 — 2.5초마다 변화가 있으면 교사 화면으로 전송
    liveDirty=false;
    liveTimer=setInterval(()=>{
      if(liveDirty){ liveDirty=false; set(ref(db,"rooms/"+myCode+"/live/"+b),exportLive()).catch(()=>{}); }
    },2500);
    $("submitDraw").onclick=()=>submit(b,r,{type:"draw",value:exportDrawing()});
  }else{
    $("playerMain").innerHTML=header+
      `<div class="promptcard guess"><div class="plabel">앞 사람의 그림</div><img src="${prev?prev.value:""}" alt="앞 그림"></div>`+
      `<div class="taskline">🤔 이 그림은 무슨 단어일까요?</div>`+
      `<input class="input" id="guessInput" maxlength="20" placeholder="단어를 적어주세요">`+
      `<div class="spacer"></div><button class="btn primary block" id="submitGuess" style="margin-top:14px">제출</button>`;
    if(keepRound===r && keepGuess) $("guessInput").value=keepGuess;   // 취소 후 복원
    setTimeout(()=>$("guessInput")&&$("guessInput").focus(),150);
    $("guessInput").addEventListener("keydown",e=>{if(e.key==="Enter")doGuess(b,r);});
    $("submitGuess").onclick=()=>doGuess(b,r);
  }
}
function doGuess(b,r){
  const g=$("guessInput").value.trim(); if(!g){$("guessInput").focus();return;}
  submit(b,r,{type:"guess",value:g});
}
async function submit(b,r,data){
  stopLive();
  data.bySeat=mySeat; data.byName=myName;
  submittedRound=r; lastSubmit={b,r}; keepRound=r;
  if(data.type==="draw") keepStrokes=strokes.slice(); else keepGuess=data.value;
  await set(ref(db,"rooms/"+myCode+"/content/"+b+"/"+r),data);
  remove(ref(db,"rooms/"+myCode+"/live/"+b)).catch(()=>{}); // 제출하면 미리보기 정리
  // 대기 화면
  const snap=await get(ref(db,"rooms/"+myCode)); renderPlayer(snap.val()||{});
}

/* ===== 그리기 캔버스 ===== */
let ctx,pad,dpr,penColor,eraser,drawing=false,lx=0,ly=0;
let strokes=[],cur=null;              // 그은 획을 기록해 되돌리기에 사용
const PEN_W=4, ERASER_W=22;
function setupCanvas(){
  pad=$("pad");
  const w=pad.parentElement.clientWidth, h=Math.round(w*0.72);
  dpr=window.devicePixelRatio||1;
  pad.width=w*dpr;pad.height=h*dpr;pad.style.height=h+"px";
  ctx=pad.getContext("2d");ctx.scale(dpr,dpr);
  ctx.lineCap="round";ctx.lineJoin="round";
  strokes=[];cur=null;
  penColor=COLORS[0];eraser=false;renderSwatches();setTool("pen");redraw();
  ["mousedown","touchstart"].forEach(ev=>pad.addEventListener(ev,down,{passive:false}));
  ["mousemove","touchmove"].forEach(ev=>pad.addEventListener(ev,move,{passive:false}));
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(ev=>pad.addEventListener(ev,up));
  $("penBtn").onclick=()=>setTool("pen");$("eraBtn").onclick=()=>setTool("eraser");
  $("undoBtn").onclick=undo;
  $("clrBtn").onclick=()=>{ strokes.push({clear:true}); redraw(); liveDirty=true; updateUndo(); };
}
function updateUndo(){ const b=$("undoBtn"); if(b) b.disabled = strokes.length===0; }
function undo(){ if(!strokes.length) return; strokes.pop(); redraw(); liveDirty=true; updateUndo(); }
function wipe(){ const w=pad.clientWidth,h=pad.clientHeight; ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); }
function paint(s){
  if(s.clear){ wipe(); return; }
  ctx.strokeStyle=s.eraser?"#fff":s.color; ctx.fillStyle=s.eraser?"#fff":s.color;
  ctx.lineWidth=s.eraser?ERASER_W:PEN_W;
  const p=s.pts;
  if(p.length===1){ ctx.beginPath();ctx.arc(p[0].x,p[0].y,s.eraser?ERASER_W/2:PEN_W/2,0,6.2832);ctx.fill();return; }
  ctx.beginPath(); ctx.moveTo(p[0].x,p[0].y);
  for(let i=1;i<p.length;i++) ctx.lineTo(p[i].x,p[i].y);
  ctx.stroke();
}
function redraw(){ wipe(); for(const s of strokes) paint(s); }
function renderSwatches(){const box=$("swatches");box.innerHTML="";COLORS.forEach(c=>{const b=document.createElement("div");
  b.className="sw"+(c===penColor&&!eraser?" on":"");b.style.background=c;
  b.onclick=()=>{penColor=c;eraser=false;setTool("pen");renderSwatches();};box.appendChild(b);});}
function setTool(t){eraser=(t==="eraser");$("penBtn").classList.toggle("on",t==="pen");$("eraBtn").classList.toggle("on",t==="eraser");renderSwatches();}
function pos(e){const r=pad.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function down(e){
  e.preventDefault();drawing=true;liveDirty=true;
  const p=pos(e);lx=p.x;ly=p.y;
  cur={color:penColor,eraser,pts:[{x:p.x,y:p.y}]};
  ctx.fillStyle=eraser?"#fff":penColor;
  ctx.beginPath();ctx.arc(p.x,p.y,eraser?ERASER_W/2:PEN_W/2,0,6.2832);ctx.fill();
}
function move(e){
  if(!drawing||!cur)return;e.preventDefault();liveDirty=true;
  const p=pos(e);cur.pts.push({x:p.x,y:p.y});
  ctx.strokeStyle=eraser?"#fff":penColor;ctx.lineWidth=eraser?ERASER_W:PEN_W;
  ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;
}
function up(){ if(drawing&&cur){ strokes.push(cur); updateUndo(); } drawing=false; cur=null; }
function exportDrawing(){
  const cssW=pad.clientWidth,cssH=pad.clientHeight,max=480;
  const tw=Math.min(max,cssW),th=Math.round(cssH*tw/cssW);
  const t=document.createElement("canvas");t.width=tw;t.height=th;
  const c=t.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,tw,th);c.drawImage(pad,0,0,tw,th);
  return t.toDataURL("image/png");
}
function exportLive(){ // 진행중 미리보기용: 더 작고 가볍게(JPEG)
  const cssW=pad.clientWidth,cssH=pad.clientHeight,max=220;
  const tw=Math.min(max,cssW),th=Math.round(cssH*tw/cssW);
  const t=document.createElement("canvas");t.width=tw;t.height=th;
  const c=t.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,tw,th);c.drawImage(pad,0,0,tw,th);
  return t.toDataURL("image/jpeg",0.5);
}

$("landFoot").textContent="달서고등학교 사회과";
</script>
